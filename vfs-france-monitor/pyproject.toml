[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vfs-france-monitor"
version = "0.1.0"
description = "Personal VFS France (Russia) appointment slot monitor with Telegram alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.49,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
vfs-france-monitor = "vfs_france_monitor.main:cli"
vfs-france-bootstrap = "vfs_france_monitor.bootstrap:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
